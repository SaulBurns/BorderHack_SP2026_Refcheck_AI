services:
  - type: web
    name: refcheck-ai-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      # Version stamp surfaced by /api/version and /api/health (set to the git SHA
      # in CI, or leave for Render to fill from the commit).
      - key: APP_VERSION
        sync: false
      # AI provider: mock | anthropic | gemini | router. Default anthropic.
      # For Gemini, set AI_PROVIDER=gemini and provide GEMINI_API_KEY below
      # (the google-genai SDK ships in the image as of Sprint 17C).
      - key: AI_PROVIDER
        value: anthropic
      - key: AI_MODEL
        value: claude-sonnet-4-5
      # Gemini config (used when AI_PROVIDER=gemini or a router routes to gemini).
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Graceful failover (Sprint 17C): if the primary provider fails a call, retry
      # once on this provider before degrading to the offline mock. Unset = no
      # failover. Recommended for a Gemini primary: PROVIDER_FALLBACK=anthropic.
      - key: PROVIDER_FALLBACK
        sync: false
      # Observability (Sprint 15).
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      # Abuse protection: requests/minute per client on the analyze endpoints
      # (0 or unset = disabled). Tune for the plan's capacity.
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      # Optional API-key auth on the write endpoints. Set to enable; unset = open
      # (comma-separated list of accepted keys). Kept as a secret.
      - key: API_KEYS
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_CLIPS_BUCKET
        value: clips
      - key: SUPABASE_VERDICTS_TABLE
        value: verdicts
